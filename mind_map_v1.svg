<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1155" viewBox="0 0 680 770" role="img">
<title>Fault or attack mind map</title>
<desc>Mind map of the Fault or Attack project: the plant, what can go wrong, what the control room sees, the detector's fault and attack signs, the verdict, and the proof.</desc>
<style>
  svg { background: #ffffff; font-family: "Segoe UI", Arial, sans-serif; }
  text { fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #ffffff; stroke: #B4B2A9; }
  .c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
  .c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
  .c-coral > rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; }
  .c-coral > .th { fill: #712B13; } .c-coral > .ts { fill: #993C1D; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M240 298 C232 298 228 50 220 50" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M240 318 C232 318 228 390 220 390" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M400 298 C408 298 412 50 420 50" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M400 318 C408 318 412 396 420 396" fill="none" stroke="#888780" stroke-width="1"/>
<g class="c-gray">
<rect x="240" y="280" width="160" height="56" rx="8" stroke-width="1"/>
<text class="th" x="320" y="300" text-anchor="middle" dominant-baseline="central">Fault or attack?</text>
<text class="ts" x="320" y="320" text-anchor="middle" dominant-baseline="central">Faults obey physics</text>
</g>
<g class="c-gray">
<rect x="20" y="30" width="200" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="50" text-anchor="middle" dominant-baseline="central">1. The plant</text>
</g>
<rect class="box" x="20" y="78" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="91" text-anchor="middle" dominant-baseline="central">Tank filled by a pump</text>
<rect class="box" x="20" y="110" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="123" text-anchor="middle" dominant-baseline="central">On/off pump or PID valve +</text>
<rect class="box" x="20" y="142" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="155" text-anchor="middle" dominant-baseline="central">Sensor A, optional backup B</text>
<rect class="box" x="20" y="174" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="187" text-anchor="middle" dominant-baseline="central">Secret + on-demand probes *</text>
<rect class="box" x="20" y="206" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="219" text-anchor="middle" dominant-baseline="central">Full/empty level switches +</text>
<rect class="box" x="20" y="238" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="251" text-anchor="middle" dominant-baseline="central">Valve lag, rounding, noise +</text>
<g class="c-gray">
<rect x="420" y="30" width="240" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="50" text-anchor="middle" dominant-baseline="central">2. What can go wrong</text>
</g>
<g class="c-teal">
<rect x="420" y="78" width="115" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="477" y="97" text-anchor="middle" dominant-baseline="central">6 faults</text>
<text class="ts" x="477" y="120" text-anchor="middle" dominant-baseline="central">Sensor drift</text>
<text class="ts" x="477" y="137" text-anchor="middle" dominant-baseline="central">Stuck sensor</text>
<text class="ts" x="477" y="154" text-anchor="middle" dominant-baseline="central">Pump failure</text>
<text class="ts" x="477" y="171" text-anchor="middle" dominant-baseline="central">Valve stuck</text>
<text class="ts" x="477" y="188" text-anchor="middle" dominant-baseline="central">Leak</text>
<text class="ts" x="477" y="205" text-anchor="middle" dominant-baseline="central">Power loss</text>
</g>
<g class="c-coral">
<rect x="545" y="78" width="115" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="602" y="97" text-anchor="middle" dominant-baseline="central">6 attacks</text>
<text class="ts" x="602" y="120" text-anchor="middle" dominant-baseline="central">Fake data</text>
<text class="ts" x="602" y="137" text-anchor="middle" dominant-baseline="central">Replay</text>
<text class="ts" x="602" y="154" text-anchor="middle" dominant-baseline="central">Noisy replay *</text>
<text class="ts" x="602" y="171" text-anchor="middle" dominant-baseline="central">Stealth spoof *</text>
<text class="ts" x="602" y="188" text-anchor="middle" dominant-baseline="central">Command inj.</text>
<text class="ts" x="602" y="205" text-anchor="middle" dominant-baseline="central">Flood (DoS)</text>
</g>
<g class="c-gray">
<rect x="20" y="370" width="200" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="390" text-anchor="middle" dominant-baseline="central">3. Control room sees</text>
</g>
<rect class="box" x="20" y="418" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="431" text-anchor="middle" dominant-baseline="central">Sensors A and B</text>
<rect class="box" x="20" y="450" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="463" text-anchor="middle" dominant-baseline="central">Command vs feedback</text>
<rect class="box" x="20" y="482" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="495" text-anchor="middle" dominant-baseline="central">Outflow meter + power</text>
<rect class="box" x="20" y="514" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="527" text-anchor="middle" dominant-baseline="central">Network traffic + writes</text>
<rect class="box" x="20" y="546" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="559" text-anchor="middle" dominant-baseline="central">New devices on network *</text>
<rect class="box" x="20" y="578" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="591" text-anchor="middle" dominant-baseline="central">Its own probe schedule *</text>
<rect class="box" x="20" y="610" width="200" height="26" rx="4" stroke-width="0.5"/>
<text class="ts" x="120" y="623" text-anchor="middle" dominant-baseline="central">Full/empty level switches +</text>
<g class="c-gray">
<rect x="420" y="370" width="240" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="387" text-anchor="middle" dominant-baseline="central">4. Detector checks</text>
<text class="ts" x="540" y="406" text-anchor="middle" dominant-baseline="central">Thresholds learned from normal +</text>
</g>
<g class="c-teal">
<rect x="420" y="432" width="115" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="477" y="451" text-anchor="middle" dominant-baseline="central">Fault signs</text>
<text class="ts" x="477" y="473" text-anchor="middle" dominant-baseline="central">Power down</text>
<text class="ts" x="477" y="490" text-anchor="middle" dominant-baseline="central">Pump won't run</text>
<text class="ts" x="477" y="507" text-anchor="middle" dominant-baseline="central">High outflow</text>
<text class="ts" x="477" y="524" text-anchor="middle" dominant-baseline="central">Flat line</text>
<text class="ts" x="477" y="541" text-anchor="middle" dominant-baseline="central">Keeps freezing +</text>
<text class="ts" x="477" y="558" text-anchor="middle" dominant-baseline="central">Drift vs B</text>
<text class="ts" x="477" y="575" text-anchor="middle" dominant-baseline="central">Steady loss</text>
<text class="ts" x="477" y="592" text-anchor="middle" dominant-baseline="central">Valve sticking +</text>
</g>
<g class="c-coral">
<rect x="545" y="432" width="115" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="602" y="451" text-anchor="middle" dominant-baseline="central">Attack signs</text>
<text class="ts" x="602" y="473" text-anchor="middle" dominant-baseline="central">Exact repeat</text>
<text class="ts" x="602" y="490" text-anchor="middle" dominant-baseline="central">Probe missing *</text>
<text class="ts" x="602" y="507" text-anchor="middle" dominant-baseline="central">Ignores valve +</text>
<text class="ts" x="602" y="524" text-anchor="middle" dominant-baseline="central">Law mismatch +</text>
<text class="ts" x="602" y="541" text-anchor="middle" dominant-baseline="central">Actuator alone +</text>
<text class="ts" x="602" y="558" text-anchor="middle" dominant-baseline="central">Foreign writes</text>
<text class="ts" x="602" y="575" text-anchor="middle" dominant-baseline="central">Traffic flood</text>
<text class="ts" x="602" y="592" text-anchor="middle" dominant-baseline="central">Breaks physics</text>
<text class="ts" x="602" y="609" text-anchor="middle" dominant-baseline="central">New device link *</text>
</g>
<line x1="420" y1="500" x2="404" y2="500" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="240" y="460" width="160" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="320" y="478" text-anchor="middle" dominant-baseline="central">5. Verdict</text>
<text class="ts" x="320" y="498" text-anchor="middle" dominant-baseline="central">Label and reason</text>
<text class="ts" x="320" y="515" text-anchor="middle" dominant-baseline="central">ATT&amp;CK ID, action *</text>
<text class="ts" x="320" y="532" text-anchor="middle" dominant-baseline="central">Escalates if unsure +</text>
</g>
<line x1="320" y1="540" x2="320" y2="656" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="20" y="660" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="678" text-anchor="middle" dominant-baseline="central">6. Proof: simple plant</text>
<text class="ts" x="120" y="698" text-anchor="middle" dominant-baseline="central">99.5% of 1,440 runs</text>
</g>
<g class="c-gray">
<rect x="240" y="660" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central">Realistic plant +</text>
<text class="ts" x="340" y="698" text-anchor="middle" dominant-baseline="central">90.5%, 0 false alarms</text>
</g>
<g class="c-gray">
<rect x="460" y="660" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="678" text-anchor="middle" dominant-baseline="central">Real HAI data *</text>
<text class="ts" x="560" y="698" text-anchor="middle" dominant-baseline="central">7 of 8 tank attacks caught</text>
</g>
<rect class="c-teal" x="80" y="738" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="102" y="745" dominant-baseline="central">Fault</text>
<rect class="c-coral" x="160" y="738" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="182" y="745" dominant-baseline="central">Attack</text>
<text class="ts" x="260" y="745" dominant-baseline="central">* added from research</text>
<text class="ts" x="430" y="745" dominant-baseline="central">+ added for the realistic plant</text>
</svg>
